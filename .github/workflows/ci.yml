name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Read-only token; no secrets are used anywhere in this workflow
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container reachable only from this runner, so no password is needed
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      JOD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --no-build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env.example holds placeholder values, which is enough to validate the file
      - run: cp .env.example .env
      - run: docker compose config --quiet
