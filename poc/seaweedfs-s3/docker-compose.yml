# Throwaway PoC for ticket 023 (SeaweedFS as S3 provider). Not for merge into dev.
# Secrets come from .secrets/ (generated by setup.sh, gitignored).
name: jod-poc
services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEED_TAG:-4.48}
    command: >
      mini -dir=/data -bucket=jod-test,jod-other
      -s3.config=/etc/seaweedfs/s3.json
      -master.telemetry=false -webdav=false
      -s3.port.iceberg=0 -s3.port.lance=0
    volumes:
      - seaweed-data:/data
      - ./.secrets/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
    restart: unless-stopped
    environment:
      WEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks: [storage]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: jod_poc
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
networks:
  storage: {}
volumes:
  seaweed-data:
  pg-data:
